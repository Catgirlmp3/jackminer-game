name: Windows build

on:
  push:
    branches: [ main, alphatest ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build WPF application
        run: dotnet build JackMiner/JackMiner.csproj --configuration Release
      - name: Publish self-contained Windows x64 build
        run: dotnet publish JackMiner/JackMiner.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output publish/win-x64
      - name: Add build identity
        shell: pwsh
        run: |
          @{ commit = "${{ github.sha }}"; branch = "${{ github.ref_name }}" } | ConvertTo-Json | Set-Content publish/win-x64/build-info.json -Encoding utf8
      - name: Upload beta build
        uses: actions/upload-artifact@v4
        with:
          name: JackMiner-beta-win-x64
          path: publish/win-x64/
          if-no-files-found: error
      - name: Package alpha updater release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/alphatest'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath publish/JackMiner-alpha-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash publish/JackMiner-alpha-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  JackMiner-alpha-win-x64.zip" | Set-Content publish/JackMiner-alpha-win-x64.zip.sha256 -Encoding ascii
      - name: Publish rolling alpha update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/alphatest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-latest
          name: JackMiner Alpha — Latest
          body: |
            Automatically generated rolling alpha build.

            Build commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            publish/JackMiner-alpha-win-x64.zip
            publish/JackMiner-alpha-win-x64.zip.sha256
