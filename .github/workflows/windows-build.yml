name: Windows build

on:
  push:
    branches: [ main, alphatest ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jackminer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build WPF application
        run: dotnet build JackMiner/JackMiner.csproj --configuration Release

      - name: Publish self-contained single-file Windows x64 build
        run: dotnet publish JackMiner/JackMiner.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output publish/raw

      - name: Assemble clean tester package
        shell: pwsh
        run: |
          $package = "publish/package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          New-Item -ItemType Directory -Path "$package/Documentation" -Force | Out-Null

          $exe = "publish/raw/JackMiner.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Single-file publish did not produce JackMiner.exe."
          }
          Copy-Item $exe $package

          @{
            commit = "${{ github.sha }}"
            branch = "${{ github.ref_name }}"
          } | ConvertTo-Json | Set-Content "$package/build-info.json" -Encoding utf8

          @'
          JACKMINER — WINDOWS x64 TEST BUILD

          1. Extract the entire ZIP to its own folder.
          2. Run JackMiner.exe.
          3. Accept the first-run notice.
          4. Use Download / Repair Required Files to install the separately
             verified XMRig resource runtime.
          5. Choose a resource mode, then explicitly confirm starting a session.
          6. Open the TABLE tab, press UNLOCK TABLE, then choose chips and DEAL.

          IMPORTANT
          The bankroll is fictional. The resource workload is real and can cause
          heat, fan noise, hardware load and electricity costs. Choose a mode
          your PC can safely cool. Nothing starts without your confirmation.
          There is no real-money gambling.

          JackMiner.exe is self-contained. The XMRig resource runtime is downloaded
          separately by the app only when you press Download / Repair Required Files.
          '@ | Set-Content "$package/Documentation/QUICK-START.txt" -Encoding utf8

          # Reject accidental multi-file or development publishes.
          $unexpected = Get-ChildItem $package -File -Recurse |
            Where-Object { $_.Extension -in @(".pdb", ".xml", ".dll", ".deps.json", ".runtimeconfig.json", ".cs", ".xaml") }
          if ($unexpected) {
            $unexpected | ForEach-Object { Write-Host $_.FullName }
            throw "Unexpected development/runtime sidecar files found in the tester package."
          }

          Write-Host "Final tester package:"
          Get-ChildItem $package -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload clean beta build
        uses: actions/upload-artifact@v4
        with:
          name: JackMiner-beta-win-x64
          path: publish/package/
          if-no-files-found: error
          retention-days: 90

      - name: Package alpha updater release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/alphatest'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/package/* -DestinationPath publish/JackMiner-alpha-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash publish/JackMiner-alpha-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  JackMiner-alpha-win-x64.zip" | Set-Content publish/JackMiner-alpha-win-x64.zip.sha256 -Encoding ascii

      - name: Publish rolling alpha update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/alphatest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-latest
          name: JackMiner Alpha — Latest
          body: |
            Automatically generated rolling alpha build.

            Build commit: ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            publish/JackMiner-alpha-win-x64.zip
            publish/JackMiner-alpha-win-x64.zip.sha256

      - name: Package main beta release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/package/* -DestinationPath publish/JackMiner-beta-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash publish/JackMiner-beta-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  JackMiner-beta-win-x64.zip" | Set-Content publish/JackMiner-beta-win-x64.zip.sha256 -Encoding ascii

      - name: Publish rolling main beta download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: JackMiner Beta — Latest
          body: |
            Automatically generated rolling main-branch beta build.

            Build commit: ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            publish/JackMiner-beta-win-x64.zip
            publish/JackMiner-beta-win-x64.zip.sha256
