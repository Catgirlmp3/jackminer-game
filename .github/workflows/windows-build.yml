name: Windows build

on:
  push:
    branches: [ main, alphatest ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build WPF application
        run: dotnet build JackMiner/JackMiner.csproj --configuration Release
      - name: Publish self-contained Windows x64 build
        run: dotnet publish JackMiner/JackMiner.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output publish/win-x64
      - name: Upload beta build
        uses: actions/upload-artifact@v4
        with:
          name: JackMiner-beta-win-x64
          path: publish/win-x64/
          if-no-files-found: error
